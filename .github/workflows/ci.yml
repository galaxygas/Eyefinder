name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux GUI and audio libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux GUI and audio libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - name: Build the reference C ripper and check it still matches the fixtures
        if: runner.os == 'Linux'
        run: |
          gcc -O2 -o legacy tools/legacy-c/src/ripper.c -lm
          cp -r crates/ef-audio/tests/fixtures/gta3_pc /tmp/gta3_pc
          ./legacy /tmp/gta3_pc
          python3 tools/check_reference.py "/tmp/gta3_pc/Extracted Audio" crates/ef-audio/tests/fixtures/reference.json

  texture-reference:
    # Rebuilds the texture fixtures and their reference with librw and an exact specification
    # decoder (tools/txd-ref), and checks they still equal the committed ones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pillow==12.3.0
      - run: tools/txd-ref/build.sh /tmp/txdref
      - run: python3 tools/txd-ref/compare.py /tmp/txdref/fixtures crates/ef-texture/tests/fixtures
