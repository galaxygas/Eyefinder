name: Test build

on:
  push:
    branches: ["agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p eyefinder -p eyefinder-cli
      - name: Package Windows test build
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/Eyefinder | Out-Null
          Copy-Item target/release/eyefinder.exe, target/release/eyefinder-cli.exe, README.md, LICENSE dist/Eyefinder/
          git rev-parse HEAD | Set-Content dist/Eyefinder/COMMIT.txt
          Compress-Archive -Path dist/Eyefinder -DestinationPath Eyefinder-test-windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: Eyefinder-test-windows-x64
          path: Eyefinder-test-windows-x64.zip
          if-no-files-found: error
