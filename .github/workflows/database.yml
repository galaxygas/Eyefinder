name: Database

# A database release (tag db-<version>) is made when the build database on main changes and its
# [database] version (crates/ef-core/data/database/database.toml) has no release yet. Eyefinder's
# "Check for a database update" installs the newest one, so the database grows without a new build.
# It is never marked "Latest": app releases keep that.
on:
  push:
    branches: [main]
    paths: ["crates/ef-core/data/database/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          DBV="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/ef-core/data/database/database.toml | head -n 1)"
          echo "version=$DBV" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/db-$DBV" > /dev/null; then
            echo "db-$DBV already exists: raise the version in database.toml to publish a new database."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.release == 'true'
      - if: steps.version.outputs.release == 'true'
        run: |
          cargo build --release -p eyefinder-cli
          target/release/eyefinder-cli db validate crates/ef-core/data/database
          target/release/eyefinder-cli db pack crates/ef-core/data/database "eyefinder-database-${{ steps.version.outputs.version }}.zip"
          {
            echo "Build database ${{ steps.version.outputs.version }}."
            echo
            echo "Install it from Eyefinder's Index page: **Database → Check for a database update**, or download"
            echo "the .zip and use **Database → Import database file**. It needs no new Eyefinder build."
            echo
            echo "See [docs/DATABASE.md](https://github.com/galaxygas/Eyefinder/blob/main/docs/DATABASE.md)."
          } > notes.md
      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.release == 'true'
        with:
          tag_name: db-${{ steps.version.outputs.version }}
          name: Database ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body_path: notes.md
          fail_on_unmatched_files: true
          files: eyefinder-database-*
