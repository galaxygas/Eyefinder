name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p eyefinder -p eyefinder-cli
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist/Eyefinder | Out-Null
          Copy-Item target/release/eyefinder.exe, target/release/eyefinder-cli.exe, README.md, LICENSE dist/Eyefinder/
          Compress-Archive -Path dist/Eyefinder -DestinationPath "Eyefinder-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: Eyefinder-*-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: |
          cargo build --release -p eyefinder -p eyefinder-cli --target aarch64-apple-darwin
          cargo build --release -p eyefinder -p eyefinder-cli --target x86_64-apple-darwin
          APP=dist/Eyefinder.app/Contents
          mkdir -p "$APP/MacOS"
          lipo -create -output "$APP/MacOS/eyefinder" target/aarch64-apple-darwin/release/eyefinder target/x86_64-apple-darwin/release/eyefinder
          lipo -create -output dist/eyefinder-cli target/aarch64-apple-darwin/release/eyefinder-cli target/x86_64-apple-darwin/release/eyefinder-cli
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$APP/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Eyefinder</string>
            <key>CFBundleIdentifier</key><string>io.github.galaxygas.eyefinder</string>
            <key>CFBundleExecutable</key><string>eyefinder</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          cp README.md LICENSE dist/
          cd dist && zip -r "../Eyefinder-${GITHUB_REF_NAME}-macos-universal.zip" .
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: Eyefinder-*-macos-universal.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo build --release -p eyefinder -p eyefinder-cli
          mkdir -p dist/eyefinder
          cp target/release/eyefinder target/release/eyefinder-cli README.md LICENSE dist/eyefinder/
          tar -C dist -czf "Eyefinder-${GITHUB_REF_NAME}-linux-x64.tar.gz" eyefinder
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: Eyefinder-*-linux-x64.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      # Runs only after all three builds succeeded. Notes come from docs/release-notes/<tag>.md.
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          body_path: docs/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: Eyefinder-*
