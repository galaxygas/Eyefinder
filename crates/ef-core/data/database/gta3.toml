[[section]]
id = "3.8"
origin = "md:540"
title = "3.8 Mobile: *Grand Theft Auto III: 10 Year Anniversary Edition* (War Drum Studios)"
games = ["gta3"]
text = "Announced by Rockstar in October 2011 (with a 1,500-unit Claude action figure, US$149.99). Described by Wikipedia as almost identical to the Windows version, with enhanced models/textures and touchscreen controls; it was the first 3D-Universe game officially translated into Korean, and the version later sold in South Korea. Contains leftover multiplayer maps, a working debug SCM and mission source files (early \"Luigi's Girls\"). [1][2][4]"

