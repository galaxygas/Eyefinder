[[section]]
id = "3"
origin = "md:419"
title = "3. Grand Theft Auto III (2001)"
games = ["gta3"]
text = '''
Developer: DMA Design (credited on the original PS2 release), later Rockstar North; publisher Rockstar Games (Capcom for the Japanese-language release; Zoo Corporation for the earlier English-language PC release in Japan). [1] Xbox port by Rockstar Vienna; Mac OS X / iOS / Android / 10th Anniversary ports by War Drum Studios. [1] PCGamingWiki credits TransGaming Inc. as Mac developer. [9] (The 2021 Definitive Edition is covered in its own section.)

Legend: ✅ confirmed by 2+ independent sources or official source · ⚠️ single community source · ❓ rumour / disputed.'''

[[section]]
id = "3.1"
origin = "md:425"
title = "3.1 Development timeline and pre-release builds"
games = ["gta3"]
text = '''
**Documented post-9/11 changes before release** (Rockstar described the game as "about 1% different") [1]:
- Police cars: blue with white stripes (NYPD-like) → black-and-white. ✅ [1][19][21]
- Dodo/plane flight path altered so the aircraft no longer appeared to fly into/behind a skyscraper. ✅ [1]
- A mission referencing terrorists removed ("We removed only one mission that referenced terrorists" — Rockstar Q&A, reported 5 Jan 2012); some pedestrian dialogue, car details and talk-radio content changed. ✅ [1][19][22]
- Original cover art replaced in North America (original art kept in Europe). ✅ [1][4]
- Darkel (revolutionary character) cut — Dan Houser: "months before [release]", i.e. not a 9/11 change. ✅ [1][20]
- School bus / schoolchildren: Rockstar called pre-release schoolchildren reports "nonsense"; GTA Wiki states Darkel never had a school-bus mission (rumour). ❓ [1][19]
- Destructible AirTrain shown in trailers cut. ⚠️ [19]

**Early mission names** (Game On 2009 exhibition, Taiwan): "Lips Forelli's Last Lunch" → "Mike Lips Last Lunch"; "Kill Chunky Lee" → (the Chunky Lee Chong mission); "Escort Town" → "Cipriani's Chauffeur"; "The Bank Job" → "The Getaway"; "Plane to Sea" → "S.A.M."; "Gone in 60 Grand" → "Grand Theft Auto"; "Wanted Man" → "The Exchange". ⚠️ [3]'''

[[section]]
id = "3.2"
origin = "md:454"
title = "3.2 Preserved / leaked prototype builds"
games = ["gta3"]
text = "Leftovers in shipped builds (TCRF): unused first-person mode (FPS_PUNCH, FPS_ROCKET anims), scrapped online multiplayer (maps left in mobile port), debug menu, flyable-helicopter code, early \"Luigi's Girls\" mission script in the iOS port, cut song \"Wash Him Off\" (Marydancin), internal string \"GTA3v2\". ⚠️ [2]"

[[section]]
id = "3.3"
origin = "md:466"
title = "3.3 PlayStation 2 releases"
games = ["gta3"]
text = "Note on disc versions: PS2 discs carry a `VER` value in SYSTEM.CNF; Redump names dumps by it (e.g. \"(v1.40)\", \"(v1.60)\"). First pass: Redump.org could not be fetched and data came from mirrors. Second pass: the Redump disc pages were read directly in a browser (disc IDs given in the sources), so version, EXE date and edition data below is primary dump-database data. Redump's \"Edition\" field lists every retail printing that a given disc image was verified against. Matching DAT entries are in Appendix A."

[[section]]
id = "3.4"
origin = "md:487"
title = "3.4 Windows PC releases, patches and digital versions"
games = ["gta3"]
text = "Downgrade note: the community \"downgraded exe\" (1.0-compatible gta3.exe) is widely used because mods (CLEO, Widescreen fix, Windowed mode) target 1.0; the 1.1 patcher does not recognise the Steam exe. ⚠️ [29][30]"

[[section]]
id = "3.4a"
origin = "md:501"
title = "3.4a PC executable builds recognised by modding tools"
games = ["gta3"]
text = "Community modding toolkits must tell PC executables apart, so their detection code is evidence of which distinct `.exe` builds exist. Plugin-SDK (the main C++ modding SDK for the 3D-era games) recognises exactly three GTA III executables, identified by the address of a known function prologue (`55 89 E5 53`, read as 0x53E58955). This confirms at least these three distinct builds (v1.0, v1.1, Steam); other executables (e.g. Japanese, Rockstar Games Launcher, Mac) exist but are not handled by Plugin-SDK. It gives no file sizes or dates; the gtamods.com exe table (sizes/timestamps) was offline during research."

