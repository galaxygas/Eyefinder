date_text = "**1 Jul 1999** (Wikipedia, citing GameSpot \"GTA2.com Launches\", 1 Jul 1999). Time Extension (29 Nov 2022) independently says \"In July 1999\". Announced **8 Jun 1999** (GameSpot \"GTA London Gains Free Pack\"). **Conflict:** GTA.wiki infobox says 1 Jun 1999 and its text says 11 Jun 1999"
id_text = "~7 MB executable (GTA.wiki); version number not documented"
notes = "Developer Rockstar Canada; director Greg Bick; producers Dan Houser and Lucien King. Needs GTA plus London 1969 installed (PCGW: \"Requires London 1969\"). 8 missions; 22 new vehicles; one new cutscene; Manchester deathmatch map; first drive-bys and armour shop; ratings BBFC 18 / ESRB M. Never released on PlayStation. An Internet Archive copy of the download dates from 2006. **Not** in the Rockstar Classics freeware package. Whether it was on Steam is not documented"
confidence = "mixed"
