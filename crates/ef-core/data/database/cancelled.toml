[[entry]]
id = "11.8-25"
origin = "md:3212"
section = "11.8"
kind = "cancelled"
games = ["cancelled"]
title = "Unofficial J2ME \".jar\" games named \"GTA\""
platforms = ["j2me"]
platform_text = "J2ME (CLDC/MIDP)"
date_text = "—"
notes = "libretro's J2ME DAT lists GTA-named jars. The vendor named in each filename's parentheses is never Rockstar or Take-Two: **\"GTA (Auer Media)\"** v1.20.02 / v1.32.02 (3 dumps) and **\"GTA_lo (Auer Media)\"** v1.20.02 (2 dumps); **\"GTA Vice city (Tag Games Limited)\"** v0.2.2; **\"GTA IV Mobile [sefan.ru] (Tag Games Limited)\"** v0.2.15; **\"GTA Soviet Russia (F.M.R)\"** v0.2.15 / v1.1.0 and \"(Tag Games, F.M.R)\" v0.2.2 / v0.2.3; **\"GTA4 BY DJ27 (DJ27 MASTER-T)\"** v1.0.9. The DAT has no publisher or year field. The \"[sefan.ru]\" tag (a download-site tag), the \"F.M.R\" and \"DJ27\" credits, and Tag Games and F.M.R jars that share version numbers all suggest unofficial or bootleg remakes; that is an inference, not stated by the DAT. These jars support, and do not contradict, the conclusion above that no official J2ME GTA exists."
confidence = "single-source"
confidence_text = "⚠️ (single list; status inferred from the vendor names)"
sources = ["11-69"]
sources_text = "[69]"

