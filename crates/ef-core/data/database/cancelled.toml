[[entry]]
id = "11.8-9"
origin = "md:3196"
section = "11.8"
kind = "cancelled"
games = ["cancelled"]
title = "***Grand Theft Auto: Online*** (\"GTA:O\"): MMO proposal by **Barking Dog Studios** (later Rockstar Vancouver)"
platforms = ["pc"]
platform_text = "PC (RenderWare, per GTA Wiki infobox)"
date_text = "c. May 2001"
notes = "An MMORPG concept pitched to Rockstar Games around May 2001, to be made with Rockstar North: a persistent online cops-and-robbers world with player-created characters. Evidence: the *Grand Theft Auto: Online* Design Document **Version 1.20, dated 31 May 2001** (Barking Dog Studios), which researchers made public in 2024 after getting it from an unnamed Rockstar employee. Obbe Vermeij posted on X on 2024-12-25 that three Barking Dog staff visited Edinburgh and that \"None of this was greenlit or actually worked on\". It is **not** the GTA III online mode in the row above. Since 2024 outlets have mislabelled it \"GTA III Online\", because the design document uses a GTA III testbed screenshot as a placeholder."
confidence = "single-source"
confidence_text = "⚠️ (wiki citing the design doc and Vermeij's post)"
sources = ["11-66"]
sources_text = "[66]"

