[[entry]]
id = "11.8-5"
origin = "md:3192"
section = "11.8"
kind = "cancelled"
games = ["cancelled"]
title = "GTA 2 — Miami project: \"expansion\" vs ***Grand Theft Auto 2.5*** (\"GTA Miami\")"
platforms = ["pc"]
platform_text = "PC"
date_text = "c.1999–2000"
notes = "**Two descriptions that conflict.** (a) Wikipedia, citing the book *Grand Thieves & Tomb Raiders*: DMA's Dundee office worked on a Miami-set GTA 2 *expansion*, dropped as the Edinburgh 3D project (GTA III) took priority. (b) GTA Wiki, citing Obbe Vermeij's blog post of 2023-11-11: the project was ***Grand Theft Auto 2.5***, also called the \"GTA Miami\" project. It was a separate game, named \"2.5\" because it would follow GTA 2 and used an isometric top-down 3D (\"2.5-dimensional\", SimCity-like) view. It was set in \"Miami\" and was cancelled when DMA's Dundee office closed. Vermeij's blog post itself could not be read on 2026-10-24 (Blogger returned \"page … does not exist\"), so (b) rests on GTA Wiki's citation."
confidence = "mixed"
confidence_text = "✅ (a: book via Wikipedia) / ⚠️ (b: wiki citing blog) / conflict on \"expansion\" vs separate game"
sources = ["11-50", "11-67"]
sources_text = "[50][67]"

