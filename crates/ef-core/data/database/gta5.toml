[[entry]]
id = "8.5-61"
origin = "md:1926"
section = "8.5"
kind = "title-update"
games = ["gta5"]
title = "1.55, 1.56 (community numbering)"
platform_text = "—"
region = "—"
date_text = "—"
confidence = "mixed"
confidence_text = "✅ (pages exist) / ❓ (Rockstar 1.55)"
sources = ["8-3", "8-43", "8-44", "8-45", "8-46", "8-47"]
sources_text = "[3][43][44][45][46][47]"
[entry.fields]
"Online ver. / internal name" = "—"
"Associated update" = "**Not used in the community numbering.** The GTA Wiki version history goes straight from 1.54 (2021-03-16) to 1.57 (2021-07-20). **Rockstar Support's own note-page numbers differ for 2021–22:** the page titled \"GTAV Title Update 1.53 Notes\" holds the dated entries for 2021-02-10 and 2021-03-16 (plus content drops through 2021-05-27). The page titled \"1.54 Notes\" holds Los Santos Tuners (2021-07-20), which the community calls 1.57. The page titled \"**GTAV Title Update 1.56 Notes (PS4 / PS5 / Xbox One / Xbox Series X\\|S)**\" holds the 2022-04-26 bug-fix update, which the community calls 1.59. The page titled \"1.61 Notes\" holds The Criminal Enterprises (2022-07-26), so the two numberings agree again from there. No Rockstar \"1.55\" page was found; it may be The Contract, but that is unconfirmed. Separately, **PS4 package versions 01.55 and 01.56** exist (Dec 2025 / Jan 2026, see §8.5b). MP1st's \"GTA 5 update 1.55 released on December 17 [2025]\" refers to one of those, not to a title update."

