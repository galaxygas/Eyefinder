[[entry]]
id = "8.4b-1"
origin = "md:1857"
section = "8.4b"
kind = "app"
games = ["gta5"]
title = "**2013-09-16** (Rockstar Newswire: \"available for download starting today\"). GameFAQs release data for each platform: **iOS** US 2013-09-16 (App Store product ID **697056811**, rated 17+); **Android** EU 2013-10-28 (`com.rockstargames.ifruit`, 18+); a third online release, EU 2013-11-20 (18+), which by the page's platform order is the **Windows Mobile** version (not labelled on the row ⚠️); **PS Vita** 2014-04-02 on the PlayStation Store, as EU **PCSB-00444** (16+) and as **PCSE-00348**, which GameFAQs tags \"KO\" / Take-Two Interactive (18)."
platforms = ["android", "winphone", "vita", "pc"]
platform_text = "Rockstar's post names **iOS (App Store), Android (Google Play), Windows Phone and PlayStation Vita** (\"Now available…\" lines added to the post after launch day). GTA Wiki adds the Amazon Appstore and **Windows 8/8.1/RT/10** (Microsoft Store product **9WZDNCRFJ1ZP**). MobyGames lists a separate PS Vita entry dated 2014 (§14)."
notes = "The in-game \"iFruit\" phone and iFruit Radio are separate things (§9). The Microsoft Store page 9WZDNCRFJ1ZP returned \"Product not found\" on 2026-10-24."
confidence = "mixed"
confidence_text = "✅ (launch date, platforms: primary) / ⚠️ (per-platform dates, versions, shutdown)"
sources = ["8-70", "8-71", "8-72", "8-73", "8-74", "8-75", "8-76"]
sources_text = "[70][71][72][73][74][75][76]"
[entry.fields]
App = "***Grand Theft Auto: iFruit***: Los Santos Customs (remote vehicle customisation and custom licence plates for GTA V and GTA Online) plus *Chop the Dog* (virtual pet that affects Chop in GTA V)"
"Versions documented" = "**Android 1.11.43.2-google**: Google Play \"Current Version\", \"Updated July 11, 2019\"; requires Android 4.3+; PEGI 18; package `com.rockstargames.ifruit`. Read from a Wayback capture of 2019-10-06. **iOS 4.0** (\"adds link for Grand Theft Auto: San Andreas, bug fixes\"), reported by Softpedia on 2014-02-18. No other version numbers found."
"End of support" = "**2022-12-12**: no longer supported and removed from the App Store and Google Play. GTA Wiki quotes a Rockstar Support notice that now redirects. Rockstar Intel adds that the app stayed on the Windows Store and had not been updated since 2019. Replaced for licence plates by the web **License Plate Creator** (announced 2023-04-13, launched 2023-04-20)."

