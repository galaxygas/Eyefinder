notes = "Predates the PC launch by about 6 months. Has debug keyboards. Contains a very early rendition of the GTA VI map (`-level env_test`), which Hidden Palace says shows Cayo Perico was partly cut GTA VI content. Also has assets for a cut Liberty City expansion and the cut \"Agent Trevor\" DLC. The newest map files were exported around 2014-12-19, later than the binary."
