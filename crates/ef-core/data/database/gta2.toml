# Grand Theft Auto 2: builds, versions, releases and history
# Imported from docs/research/GTA_Builds_Versions_Database.md by tools/db/import_research_md.py.
# This file is the source of truth now: edit it by hand (see docs/DATABASE.md).

[[section]]
id = "2"
origin = "md:230"
title = "2. Grand Theft Auto 2 (1999)"
games = ["gta2"]
text = '''
Developer: DMA Design (Dundee; lead programmer Keith Hamilton) — GBC port by Tarantula Studios — Publisher: Rockstar Games (Russia PC: Buka Entertainment; Japan PC: Zoo) [1][2][5][6].
Original working title / pre-rebrand name: "Grievous Bodily Harm" (G.B.H.) ⚠️ [4]; rejected working title "Eh Stole E' Motur" [1].'''

[[section]]
id = "2.1"
origin = "md:235"
title = "2.1 Pre-release builds, prototypes & demos"
games = ["gta2"]
text = "Demo notes: Take-Two's 21 Oct 1999 shipping press release states the demo had \"over 1 million Internet downloads\" [13]. Softpedia mirrors the demo as `GTA2DEMO.exe` (12.3 MB) [14]. gtamp.com labels its mirror the \"8.6 timed demo\" (\"playable 6 minute demo\") — conflicts with gta.wiki's \"v8.9\"; exact demo version therefore ⚠️ [3][15]."

[[section]]
id = "2.2"
origin = "md:257"
title = "2.2 Original retail releases (1999–2001)"
games = ["gta2"]
text = '''
Note: release dates conflict heavily between sources; all variants are listed. Take-Two press release (Business Wire, 21 Oct 1999): PlayStation and PC versions "began shipping to retailers worldwide", >1.2 million units to ship over three days, expected >US$33 m gross revenue in FQ ending 31 Oct 1999 [13].


Dreamcast porting studio: Sega Retro credits the Dreamcast version to "**DMA Design, Liquid Games**" [52]. No second source was found: gta.wiki's Dreamcast page, the GameSpot preview, Grand Theft Wiki ("DMA Design/Tarantula Studios" for all platforms) and The Dreamcast Junkyard name no porter, and MobyGames credits were blocked by a bot check. ⚠️ (single source).

PAL Dreamcast date: the build dates (Redump 2 Jul 2000; Hidden Palace 3 Jul 2000; French disc 16 Jul 2000) and Sega Retro's retailer-sourced dates (UK/DE 4 Aug, FR 2 Aug) all point to **late Jul–Aug 2000**. The 2 May and 20 May 2000 PAL dates are contradicted by every build date [8][48][52].'''

[[section]]
id = "2.3"
origin = "md:291"
title = "2.3 PC executable versions & patches (official and community)"
games = ["gta2"]
text = '''
**Original retail version:** redump.org records **version 9.6** for the original 1999 US and EU retail discs (masters dated 9–15 Oct 1999), and for every later Western reissue it lists (Xplosiv, Gamer's Choice, PC Best Buy, Take Two Heritage, Złota Edycja, Classics Collection 2004). The Russian Buka disc is **10.1** (Nov 1999) and the Japanese Zoo disc **10.5** (Jan 2000) [48]. No dated list of official Rockstar patches was found. The other numbers below come from community sources.


Related multiplayer tooling: GTA2 Game Hunter (by Sektor) — first version 24 Jan 2005; v1.483 (13 Feb 2008), v1.484 (15 Feb 2008), v1.485 (22 Feb 2008), v1.487 (6 Mar 2008) [35][36]. Native MP: up to 6 players via DirectPlay (Internet/LAN/serial/modem; ports TCP/UDP 2300–2400, 47624) [2][6].
Debug: registry value `bob_debug_display`=1 under `HKLM\SOFTWARE\DMA Design Ltd\GTA2\Debug` unlocks a Debug tab in GTA2Manager (debug keys, camera/teleport) [7].'''

