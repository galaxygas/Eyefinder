[[entry]]
id = "2.4-3"
origin = "md:327"
section = "2.4"
kind = "reissue"
games = ["gta2"]
title = "Steam"
platforms = ["pc"]
platform_text = "Windows"
region = "WW"
date = "2008-01-04"
date_text = "4 Jan 2008"
id_text = "App ID 12180; depot 12181"
notes = "Part of \"Rockstar Games Brings Full Line-up to Steam\" launch (10% off, Rockstar Collection $53.95). DRM-free after install; Steam Cloud. Two stages. (1) **Sales ended:** unpurchasable worldwide by **12 Oct 2022** at the latest (Steam Community thread: \"Rockstar just removed the game from Steam\"). One user there claims \"removed on all of Steam, since 2013\", which is unsourced ❓; it matches the May 2013 shutdown of Rockstar Classics downloads, but nothing links the two. (2) **Store page removed:** it now redirects to the Steam home page. ixbt.games ran \"Rockstar удалила страницу Grand Theft Auto 2 из Steam\" with a URL dated **17 Jul 2025** (page body not retrievable). GTAboom (30 Jul 2025) says fans noticed \"earlier this week\". So the page went in **mid/late Jul 2025** ⚠️. PCGW: unavailable. SteamDB still lists the app (last record update 29 Sep 2026; its pages are behind a bot check)"
confidence = "mixed"
confidence_text = "✅ release / ⚠️ delist dates"
sources = ["2-1", "2-2", "2-39", "2-40", "2-53", "2-54", "2-55"]
