kind = "prototype"
games = ["advance"]
title = "Transfer to Digital Eclipse"
platforms = ["gba"]
platform_text = "GBA"
region = "–"
date_text = "after Nov 2002"
id_text = "–"
notes = "Rockstar moved the project to Digital Eclipse. Rockstar's Susan Cummings arranged it through earlier contacts, and the game was made \"in collaboration with Rockstar North\". The GTA III port concept was dropped in favour of an original prequel story. Ex-Crawfish staff say some Crawfish elements survived, but not the controls or multiplayer. Destination Software kept claiming to be publisher for about a year but did not publish the final game."
confidence = "confirmed"
confidence_text = "✅"
sources = ["6-2", "6-3"]
sources_text = "[2][3]"

