games = ["advance"]
title = "Crawfish Interactive *GTA 3* GBA (cancelled)"
platforms = ["gba"]
platform_text = "GBA"
region = "–"
date_text = "Planned for late 2002, then 2003"
id_text = "not documented"
notes = "Developed by **Crawfish Interactive**. Cancellation rumours appeared in Nov 2002; Destination denied them. About a week later Crawfish closed and laid off its staff (GTA Wiki: Crawfish \"went defunct in November 2002\"). Story per ex-developer Dave Murphy: set a few months before GTA III, with a different protagonist (Lost Media Archive says Claude was planned) who works for the Mafia. Four planned multiplayer modes: Liberty City Survivor, City Circuit, Car Jack Crazy and Special Delivery."
confidence = "confirmed"
confidence_text = "✅"
sources = ["6-2", "6-3", "6-4"]
sources_text = "[2][3][4]"

