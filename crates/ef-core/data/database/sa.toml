[[section]]
id = "5.2"
origin = "md:905"
title = "5.2 PlayStation 2 releases and disc revisions"
games = ["sa"]
text = "Redump-derived dat (libretro-database `metadat/redump/Sony - PlayStation 2.dat`) lists every verified SA PS2 disc; serial variants sharing one hash are the same disc pressing sold under different catalogue numbers (e.g. budget lines) [S17]. Version strings (v1.00/v1.03/v2.01/v3.00) are the redump-recorded in-disc versions. TCRF calls the post–Hot Coffee build \"Version 2 (2.01)\" (July 2005) and says it is the build used by the Second Edition, Greatest Hits/Platinum and Trilogy copies [S2] — note redump labels the North American re-release **v3.00**, not 2.01 [S17]."

[[section]]
id = "5.3"
origin = "md:927"
title = "5.3 Windows PC — retail, patches, Steam, Rockstar Games Launcher, Microsoft Store"
games = ["sa"]
text = "**Note on gtamods.com:** the GTAMods wiki pages (`San_Andreas`, `Gta_sa.exe`) could not be retrieved (first pass: server error / robots block; second pass, 2026-10-24: GTANet \"Back soon\" maintenance page, no archive.today capture), so exe file sizes and checksums from that wiki are **not reproduced**. Executable identification below comes from the open-source modding SDKs that detect each exe (plugin-sdk, gta-reversed), PCGamingWiki and TCRF."

