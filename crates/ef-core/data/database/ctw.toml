[[section]]
id = "6.4"
origin = "md:1292"
title = "6.4 Grand Theft Auto: Chinatown Wars (DS 2009 · PSP 2009 · iOS 2010 · iPad HD 2010 · Android/Fire OS 2014)"
games = ["ctw"]
text = "Developed by **Rockstar Leeds** with **Rockstar North**. Published by Rockstar Games, and in Japan by **Cyberfront** (DS). The Android port, and per Wikipedia's footnotes the 2014 iOS re-port, are credited to **War Drum Studios** [40][41][42]."

