[[section]]
id = "12"
origin = "md:3312"
title = "12. Compilations, Collections, Bundles & Special Editions"
games = ["collections"]
text = "Scope: every multi-game compilation, bundle, \"special/collector's/complete\" edition and console-hardware bundle of Grand Theft Auto titles. Single-game platform ports, budget reprints of a single game and expansions are covered in their own sections; they appear here only where they were sold as part of a bundle or as a named special edition. Confidence key: ✅ confirmed by an official or multiple independent sources; ⚠️ single community/database source, or sources conflict; ❓ rumour/unverified. \"Not documented\" means no source was found during this research pass — not that the item does not exist."

[[section]]
id = "12.1"
origin = "md:3316"
title = "12.1 2D era (1997–2004)"
games = ["collections"]
text = '''
Notes:
- MobyGames treats "Grand Theft Auto: The Classics Collection" and "Grand Theft Auto: Collectors' Edition" as alternate titles of one compilation (Moby ID 16649), released for PlayStation and Windows [8]. GameFAQs keeps them as separate products: Collectors' Edition (PS) and The Classics Collection (PC) [59][60].
- The task brief also mentions "The Grand Theft Auto Collection (PS1 GTA+London)" and "GTA: The Collection". No source in this pass documents a release under exactly those names. The PS1 GTA + London two-disc sets are documented as **Director's Cut** (NA) and **Double Feature** (AU) [1][58].'''

[[section]]
id = "12.2"
origin = "md:3339"
title = "12.2 3D universe era (2003–2010)"
games = ["collections"]
text = '''
Notes:
- The Trilogy also served as the revised retail package for San Andreas after the July 2005 "Hot Coffee" recall (Wikipedia series article). The PS4 re-release Wikipedia mentions is now partly documented: GameFAQs lists an Australian PS Store Trilogy on 9 Feb 2016 [62]. The separate PS2-on-PS4 games came out on 5 Dec 2015 [17, 18].
- The 2006 PS2 Trilogy was announced as US-only. GameFAQs dates a European PS2 Trilogy to 31 Jul 2009 [62] ⚠️.'''

[[section]]
id = "12.3"
origin = "md:3365"
title = "12.3 HD universe — GTA IV era (2008–2012)"
games = ["collections"]
text = '''
Notes:
- The task brief mentions a possible "Rockstar Games Collection (Edition 1, PC 2006?)". The only documented "Rockstar Games Collection: Edition 1" is the 2012 PS3/Xbox 360 North American release above; contemporaneous reports said a PC or European version was unconfirmed [40]. No 2006 PC release under that name was found.
- An Xbox 360 hardware bundle with GTA IV + Episodes from Liberty City is widely remembered but was **not verified** in this pass. ❓'''

[[section]]
id = "12.4"
origin = "md:3381"
title = "12.4 HD universe — GTA V era (2013–present)"
games = ["collections"]
text = '''
Notes:
- Retailer pre-order and "special edition" in-game bonuses for GTA V are described in Wikipedia only as "extra in-game features" [42, 47].
- Xbox One and Xbox 360 hardware bundles for GTA V are widely reported but were **not verified** here. ❓'''

