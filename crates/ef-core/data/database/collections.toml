[[entry]]
id = "12.7-5"
origin = "md:3448"
section = "12.7"
kind = "compilation"
games = ["collections"]
title = "Steam \"Grand Theft Auto Complete Pack\" / \"Rockstar Complete Pack\""
notes = "Not verified. The current Steam store lists no GTA bundle except the GTA V Enhanced editions. The delisted Steam apps (GTA III 12100, VC 12110, SA 12120, EFLC 12220, GTA V Legacy 271590) return no package data from the Steam store API, and steamdb.info answered with a bot check. GameFAQs gives Steam ID 11902 for the PC/Mac Trilogy (6 Jan 2011) [62]. *Update (audit pass):* a 2013 Steam \"Grand Theft Auto Complete Pack\" (sub 18832) is now partly documented; see the follow-up row below."

[[entry]]
id = "12.7-6"
origin = "md:3449"
section = "12.7"
kind = "compilation"
games = ["collections"]
title = "**Steam \"Grand Theft Auto Complete Pack\"** (follow-up)"
notes = "**Partly verified.** Cowcotland (2013-04-28): a Steam bundle at €12.49 with seven games: GTA, GTA 2, GTA III, Vice City, San Andreas, GTA IV and Episodes from Liberty City. A Steam Community thread (opened 2013-12-27) has a buyer who bought it on 2013-03-29 and got GTA 1 and 2 under the package name \"GTA Complete Pack (ROW)\", linking SteamDB **sub 18832**. Steam's packagedetails API returns `success:false` for 18832 (delisted). MobyGames separately lists \"Grand Theft Auto: Complete Pack\" (2010, Windows) and \"Grand Theft Auto Complete Package\" (2013, Windows). Whether those are this Steam bundle is **not documented**; the dates differ. [77][78][79] ⚠️"

[[entry]]
id = "12.7-7"
origin = "md:3450"
section = "12.7"
kind = "compilation"
games = ["collections"]
title = "MobyGames-only listings (audit §14.2)"
notes = "Seen only in the MobyGames \"Grand Theft Auto series\" group (Wayback capture 2026-01-10): **\"Grand Theft Auto: Collection\" (2008, Windows)** and **\"Grand Theft Auto: Online – Shark: Extortionate Value\" (2015, Windows)**. MobyGames was behind a Cloudflare check on 2026-10-24, so the game pages could not be read. A GameFAQs search for \"grand theft auto collection / complete / pack\" and \"shark extortionate\" found neither, and a web search for \"Extortionate Value\" returned only the current Microsoft Store shark-card bundles. Contents, IDs and exact dates are **not documented**. [79][80] ⚠️ (listing only)"

