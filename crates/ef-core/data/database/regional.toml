title = "13. Country-specific Releases, Censorship & Localisation"
games = ["series"]
text = "Cross-game view of what differs per country/region. Confidence: ✅ confirmed by an official/primary or multiple independent sources · ⚠️ single community source (wiki/forum/fan cut report) · ❓ rumour / unverified. \"Not documented\" = searched, nothing found. Src numbers refer to `#### Sources (Section 13)` at the end."

[[section]]
id = "13.1"
origin = "md:3543"
title = "13.1 Germany (USK / BPjS-BPjM indexing)"
games = ["series"]
text = '''
**System notes.** German releases from GTA III onwards were typically edited to obtain a USK 16 rating ("Deutsche Version"). On the first PS2/PC editions of GTA III and Vice City the cuts were tied to the German language setting — switching the console/PC to another language gave the uncut game; later German releases removed this loophole [S3][S5]. A Vice City PS2 first edition was indexed by the Bundesprüfstelle für jugendgefährdende Schriften (BPjS) in March 2003 precisely because the uncut English version was reachable through the language setting [S4]. Foreign (Austrian/Swiss/UK) versions have no region lock and play uncut on German systems [S6].


**Indexing summary (Germany).** Documented BPjS/BPjM listings: Vice City (first PS2 edition, Mar 2003; delisted Oct 2014, re-rated uncut USK 18 Dec 2014); Vice City Stories (EU PS2, Nov 2007; delisted Oct 2015); Liberty City Stories (EU PS2, Dec 2007; delisted Sep 2015); San Andreas (EU PC, 7 Jan 2009; delisting session 3 Sep 2015). Schnittberichte headline "Drei Grand Theft Auto-Teile rehabilitiert" ("Three GTA parts rehabilitated", news 9573) and "Nach Listenstreichung: GTA-Teile unzensiert geprüft" (ticker 2118) refer to a delisting/uncut re-rating batch — page bodies could not be fetched; the 2015 trio (SA, LCS, VCS) plausibly matches "three parts", but this is ❓ unverified. GTA III was *not* indexed according to Schnittberichte's VC report [S5].'''

[[section]]
id = "13.2"
origin = "md:3570"
title = "13.2 Japan (CERO; Syscom / Capcom / CyberFront / Take-Two Japan)"
games = ["series"]
text = "**Background.** Rockstar/Take-Two chose Capcom for GTA III in 2003 over the smaller publishers that had handled GTA 1 and 2 (Time Extension names Syscom Entertainment and Zoo Corporation) [S23]. Japan had no mature rating until CERO (est. June 2002); CERO later introduced the adults-only \"Z\" rating; grandtheftwiki states all GTA games in Japan were rated CERO Z/18 [S23][S25]. Kanagawa Prefecture's child-welfare council moved on 30 May 2005 to designate GTA III a \"harmful\" product (no sale/rental under 18, separate display) — first such action in Japan over violence (not sex); approved the following month [S23][S26]. Game Developer (Aug 2008) states two of Japan's 47 prefectures banned GTA III (PS2) from sale [S28]."

[[section]]
id = "13.3"
origin = "md:3597"
title = "13.3 Australia (OFLC / Classification Board; no R18+ for games until 2013 [S18])"
games = ["series"]
text = "Rockstar statement (4 Feb 2008, quoted by Refused-Classification): \"No GTA has been censored since VICE CITY\" — reversed in April 2008 when it confirmed an edited GTA IV [S43c]. Edits were performed by the distributor/developer before submission; the Board stated (6 May 2008) \"The board did not make any changes\" [S43c]."

