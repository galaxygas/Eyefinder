Russian, Polish and Czech data now come from the ru/pl/cs Wikipedia infoboxes, read through the MediaWiki API in the second pass, plus redump disc records. Russian localisations were text-only; ru.wiki says the EFLC localisation translated subtitles and interface only.


Italian and Spanish distributors: **not documented**. The it.wiki and es.wiki infoboxes name only Rockstar Games and digital stores.'''

