[[section]]
id = "9.2015"
origin = "md:2298"
title = "2015 — Heists, PC launch, last-gen cut-off"
games = ["gta-online"]
text = '''
Notes:
- Xbox 360's final TU was 1.29 (17 Nov 2015). PS3's final TU was 1.36 (9 Dec 2016, "PS3 Only") [S6] ⚠️.
- Numbering: GTABase and GTA Wiki give the **Online** version (1.27, 1.28…) as the main number from 2015 on. The GTA V version on PS4/XB1 ran separately (1.11, 1.12, 1.13…).'''

[[section]]
id = "9.2016"
origin = "md:2316"
title = "2016 — Enhanced-only era (PS4 / XB1 / PC)"
games = ["gta-online"]
text = '''
Note: dlclist also contains numbered patch packs `patchday1ng`…`patchday20ng` between the content packs (later reaching at least `patchday24ng`, per DurtyFree's Feb 2021 commit). They are fix and asset packs, not titled updates, and the sources do not map them to specific updates [S4][S5].

PC builds 2015–2016 seen as patch uploads on playground.ru (Russian community file site; dates are **upload** dates, and the uploads name no update) [S96] ⚠️: 1.0.393.2 ("Update 7", 10 Jul 2015), 1.0.393.4 ("Update 8", 9 Aug 2015), 1.0.463.1 (16 Sep 2015), 1.0.573.1 (17 Dec 2015), 1.0.678.1 (28 Apr 2016), 1.0.757.2 (12 Jun 2016), 1.0.757.4 (14 Jun 2016). Upload dates fall one or two days after Freemode Events (15 Sep 2015), Executives and Other Criminals (15 Dec 2015) and Finance and Felony (7 Jun 2016), but no source ties these builds to those updates. Any such pairing is inferred from dates only ❓.'''

