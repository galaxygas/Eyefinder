kind = "edition"
games = ["gta-online"]
title = "**Criminal Enterprise Starter Pack**"
notes = "Released 14 Dec 2017 on PS4, XB1 and PC without prior announcement, at US$39.99. Contents: GTA$1,000,000 plus properties (Executive Office, Bunker, Counterfeit Cash Factory, Biker Clubhouse, 2-car apartment, 10-car garage), 10 vehicles, weapons, 31 outfits and 61 tattoos, about GTA$12.05M in asset value. Bundled with retail GTA V as the **Premium Online Edition** from 20 Apr 2018. By 21 Dec 2017 three further store bundles pairing the pack with a Great White, Whale or Megalodon Shark Card were on the Microsoft, Sony and Steam stores (GTAboom, 21 Dec 2017) [S95] ⚠️. Discontinuation or replacement: **not documented**. On PS5/XSX the **Career Builder** fills the starter role (pick one of four businesses and get GTA$4M)"
confidence = "single-source"
confidence_text = "⚠️"
sources = ["9-S10", "9-S13"]
sources_text = "S10, S13"

[[entry]]
id = "9.D-2"
