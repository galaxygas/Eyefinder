games = ["gta5"]
title = "**\"Agent Trevor\"** (cancelled espionage episode starring Trevor)"
notes = "Script references (`dlc_agenttrevor`, a mission list with codenames) were found in the TU 1.13/1.14 files and updated by the Dec 2023 source-code leak. The leak also used the name \"Clifford\", which GTA Wiki says was later debunked. Steven Ogg said (Apr 2024 podcast) that he recorded some work before it \"just disappeared\". Joe Rubino said about half was finished. Dan Houser said in an Oct 2025 interview that it was half complete and was abandoned for RDR2. GTA Wiki says parts of the content were reused in Online (e.g. the Stromberg in The Doomsday Heist, Valkyrie and Insurgent in Heists)"
confidence = "single-source"
confidence_text = "⚠️ (one wiki citing several interviews; parts marked unverified)"
