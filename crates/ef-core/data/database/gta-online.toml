section = "9.D"
kind = "edition"
games = ["gta-online"]
title = "**Standalone GTA Online**"
notes = "Released 15 Mar 2022 for PS5 and XSX/S alongside Expanded & Enhanced GTA V. Free on PS5 for the first three months (until 14 Jun 2022). On Xbox Series X it cost US$9.99 / £8.99 for the first three months (GINX). Standard price after 14 Jun 2022: **US$19.99 / £17.99** on both PS5 (Push Square, 7–8 Mar 2022) and Xbox Series X (GINX, 10 Mar 2022). For comparison, the PS5 story-mode-only GTA V was US$9.99 until 14 Jun 2022 and the combined package US$39.99 afterwards (Push Square)"
confidence = "confirmed"
