title = "**GTA V \"Oct 13, 2014\" prototype (GTA5_NG QA Version 108 / version 0.0.0.77)**: full multi-platform development build"
version = "0.0.0.77"
notes = "Build date 2014-10-13. Hidden Palace lists the file release date as **2026-09-18** (\"four year anniversary of the 2022 leaks\"). It came from the \"Build\" directory taken in the Sept 2022 intrusion, was sold privately, and was then leaked by an unknown buyer. Binaries and baked assets for all platforms; debug keyboards. Contains a very early rendition of the GTA VI map (`-level env_test`). Hidden Palace says this shows Cayo Perico was partly cut GTA VI content. Also has assets for a cut Liberty City expansion and the cut \"Agent Trevor\" DLC. Map files last exported c. 2014-12-19. §8.1 currently says no pre-release GTA V build was found; §11.6 says \"none … leaked\". Both are now out of date."
confidence = "single-source"
confidence_text = "⚠️ (single community source; recent)"
sources = ["14-3"]
sources_text = "[3]"
