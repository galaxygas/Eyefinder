[[section]]
id = "6"
origin = "md:1114"
title = "6. Handheld & Spin-off Era"
games = ["advance", "lcs", "vcs", "ctw"]
text = '''
> Scope: Grand Theft Auto Advance (GBA), Liberty City Stories, Vice City Stories, Chinatown Wars, cancelled handheld projects, and the PSN and mobile ports of the handheld games. Compilations are cross-referenced only (see Section 12). Earlier handheld ports (GTA 1 and GTA 2 on Game Boy Color) belong in Sections 1–2.
>
> **How the disc and cartridge data was gathered:** serials and version strings marked "dat" come from the No-Intro (cartridge, PSN) and Redump (UMD, DVD) DAT files as mirrored in the libretro-database GitHub repository (DAT versions dated 2026-10). The redump.org and datomatic.no-intro.org websites refused automated access during this research, so the individual disc pages could not be opened. Each DAT entry is one verified dump of a physical or digital copy. Where Redump lists the same serial more than once, the entries are different pressings (different hashes); the table shows the suffix printed on the disc (e.g. `/P` = Platinum, `GH` = Greatest Hits).'''

[[section]]
id = "6.6"
origin = "md:1377"
title = "6.6 Gaps and open items (Section 6)"
games = ["advance", "lcs", "vcs", "ctw"]
text = '''
- **Redump and No-Intro web pages** (disc pages with EXE dates, barcodes, EDC, ring codes) could not be opened; serials, version strings, sizes and CRCs come from the DAT files mirrored on GitHub. On-sale dates per LCS pressing (v2.00, v3.00) remain **not documented**; only their build dates (Hidden Palace) are known. Most reissue dates added in the second pass (Platinum, Greatest Hits, Best Price, Rockstar Classics, PSN Store dates) come from GameFAQs (user-contributed) alone and are flagged ⚠️; only the LCS PSP Best Price! date (2008-07-24) is confirmed by a second source (Kakaku.com).
- **LCS launch dates conflict:** Wikipedia and others give 2005-10-25 (NA) / 2005-11-04 (EU); Hidden Palace and GameFAQs give 2005-10-24 / 2005-10-28. Unresolved.
- **Japanese serial roles** are now attributed via GameFAQs (original vs Best Price / Best Hits for LCS PSP & PS2, VCS PSP & PS2, CTW PSP); apart from the LCS PSP Best Price date, these are single-source.
- **Hidden Palace** pages give build dates, UMD labels, dumpers/leakers and original filenames but **no hashes**. Several LCS, VCS and CTW prototypes are listed as "Dumped, not released". The VCS Sep 24, 2006 prototype's releaser is unrecorded on HP.
- **TCRF** (tcrf.net and new.tcrf.net) could not be opened (Cloudflare challenge / navigation refused), so TCRF's VCS `Proto:` page and the CTW pages remain unchecked.
- **Chinatown Wars:** the iPad HD app ID (id386183589) is found, but its version history is not (the App Store page returns an error). The Fire OS ASIN is still not documented. The HD app's retirement date conflicts (Dec 2014 vs the store text's 3 Apr 2015). The Korean PSP release (ULKS-46223, 2009-11-02) and the Japanese publisher (CyberFront) rest on GameFAQs only.
- **LCS/VCS on PS4/PS5:** no release found (US PlayStation Store search, web search); GameFAQs marks the VCS PS4 Store entry "Canceled". This shows absence only, not proof.
- **Korean releases:** LCS Korea (ULKS-46157) still has no documented date. VCS Korea (2007-02-28) has no known serial.
- **Android versions:** now documented from Rockstar's own update notes (LCS from v1.9, 2016; CTW from v1.01, 2015). Launch-day version numbers and the gaps between the 2016–2019 and 2023+ builds are not documented.'''

[[section]]
id = "11"
origin = "md:2907"
title = "11. Grand Theft Auto VI, Leaks, Cancelled & Lost Projects"
games = ["series"]
text = "> Scope: Grand Theft Auto VI (status as researched on 2026-10-24, i.e. **before** its scheduled 2026-11-19 launch), the major leaks affecting the series (2022 Rockstar hack, 2023 trailer leak, 2023 GTA V source-code leak, 2026 \"CyberLeek\" leaks), an index of known leaked prototype/debug builds across all games, and cancelled / unreleased / lost projects. Legend: ✅ confirmed by official source or multiple reputable outlets; ⚠️ single community source, secondhand report, or fan-site only; ❓ rumour / unverified claim. \"Not documented\" = searched for but no evidence found."

[[section]]
id = "11.7"
origin = "md:3111"
title = "11.7 Index of known leaked / preserved prototype & debug builds (all games — cross-reference)"
games = ["series"]
text = '''
Detailed rows live in each game's section; this index only points to them. "Leaked" = surfaced without publisher authorisation.

*(Refreshed in the audit-integration pass, 2026-10-24.)* This index lists every prototype, pre-release, demo, test-sample and dev-kit leftover entry now in Sections 1–8, plus the GTA VI items in this section. Build dates are those the cited section gives. Most come from Hidden Palace infoboxes, where a date can be a file or package modification date (the section rows say which). "Dumped, not released" means Hidden Palace records a dump that is not public. "Surfaced" is the public release or leak date where documented. Retail discs that Hidden Palace merely labels "beta" are marked as such.


Note: TCRF calls the 2025 LCS leaks the first time a 3D-era GTA prototype was leaked in full [42]. Hidden Palace's GTA 2 Dreamcast, GTA (1997) PS1 and GTA 2 PS1 builds are older leaks of 2D-era games.'''

[[section]]
id = "11.10"
origin = "md:3229"
title = "11.10 Gaps & caveats (Section 11)"
games = ["series"]
text = '''
- GTA VI is **unreleased** at research date (2026-10-24): no retail build numbers, day-one patch, PC version or GTA Online-for-VI details exist publicly.
- **GTA VI development build numbers (§11.3a)** come from one community document [70]. A web search found no second source listing the same numbers, and the document does not say where each number was read from. Treat them as ⚠️ until a second source confirms them. The 32 leaked clips the document does not name are not covered.
- Web-search quota was exhausted partway through research; the following could not be further verified and are flagged accordingly: GTA Tokyo, any GTA IV third episode, alien/zombie GTA V DLC, official J2ME GTA, PEGI/USK/CERO ratings, CyberLeek identity.
- TCRF prototype pages for GTA 2, London 1969 and Vice City, and GTA Wiki (Fandom) pages, could not be retrieved (site errors); per-game sections hold what was found.
- 30 fps frame-rate claim for GTA VI is secondhand (YouTuber account), not a Rockstar statement.
- **Audit integration (2026-10-24):** added the GTA VI Ultimate Edition Upgrade, the GTA+ month for digital pre-orders, the lack of a physical Ultimate Edition and the PlayStation code region locks (all from Rockstar Support); the Barking Dog *GTA: Online* proposal (2001); the "GTA 2.5" description, shown next to the Miami "expansion" wording as a conflict; the unofficial J2ME jars; the 1.0.2699.0 source build; and the leaked GTA V Oct 13, 2014 build. The stale §11.6 statement is corrected, and the 11.7 index was rebuilt from Sections 1–8. Still open: Obbe Vermeij's 2023-11-11 blog post (the primary source for "GTA 2.5") could not be loaded, and the Barking Dog design document itself was not seen, only GTA Wiki's citation of it.'''

