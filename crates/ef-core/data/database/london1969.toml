[[section]]
id = "1.7"
origin = "md:139"
title = "1.7 Grand Theft Auto: Mission Pack #1 – London 1969"
games = ["london1969"]
text = "Developed by **Rockstar Canada** (later Rockstar Toronto), outsourced by DMA Design. PS1 port: the credits transcribed on GTA.wiki's London 1969 Credits page list \"**Conversion by: RuneCraft Limited**\" and \"**VisOS Programming: Visual Sciences**\" (Visual Sciences' VisOS framework, also used for the GTA PS1 port). That explains the old conflict: Wikipedia and GTA.wiki credit Runecraft, PSXDC credits Visual Sciences / DMA, and both companies are in the credits [49]. Originally due to be published by Gathering of Developers; published by Rockstar Games / Take-Two. Announced Feb 1999 (IGN 2 Feb; GameSpot 10 Feb). The PS1 version needs the original GTA disc (disc swap). TCRF: the PC release has separate Windows and DOS graphic sets; the Windows EXE contains \"gta2.exe\" debug strings (the DOS EXE doesn't); debug mode via the player name `ROMMEL`; unused Petrol Bomb. Topped the UK charts for its first two weeks. [30][32][34][36]"

