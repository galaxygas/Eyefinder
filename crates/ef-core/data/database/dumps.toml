[[section]]
id = "A"
origin = "md:3985"
title = "Appendix A. Preserved Retail Disc & Cartridge Dumps (Redump / No-Intro)"
games = ["series"]
text = "This appendix lists every Grand Theft Auto entry found in the Redump (optical discs) and No-Intro (cartridges, digital/PSN/XBLA packages, title updates) preservation databases, as mirrored in the libretro-database repository on GitHub (snapshot cloned 2026-10-24) [A1][A2][A3]. Each row is one verified dump of a distinct retail release, revision or digital package; the dump name carries the database's own region, language and version/revision labels (e.g. `(v1.03)`, `(Rev 1)`, `(EDC)`). Multiple serials on one row mean the same disc image was found under several catalogue numbers (reprints such as Platinum/Greatest Hits, or ANZ/regional SKUs). Size is the total of all tracks/files in bytes; CRC32 is of the first track/file. ✅ for all rows: these are checksum-verified dumps."

