[[section]]
id = "1.3"
origin = "md:84"
title = "1.3 Grand Theft Auto (1997): PC (MS-DOS / Windows 95)"
games = ["gta1"]
text = "One CD carries both DOS and Windows versions. Windows renderers are chosen in setup: 8-bit software, 24-bit software, or 3Dfx Glide (PCGW: Glide 2.42). DOS uses VESA SVGA. Windows multiplayer uses DirectPlay (TCP/UDP ports 2300–2400 and 47624). Registry key: `HKLM\\Software\\DMA Design\\Grand Theft Auto`. Saves: `GTADATA\\PLAYER_A.DAT`. Minimum spec: Pentium 75, 16 MB RAM, 80 MB HDD, 1 MB VESA SVGA. User reports (unverified) name the DOS executables/folders `GTADOS`, `GTA8`, `GTA24`, `GTAFX` and the Windows folder `GTAWIN`. [1][9][37]"

[[section]]
id = "1.4"
origin = "md:103"
title = "1.4 Grand Theft Auto: PlayStation (port by Visual Sciences, ViSOS framework)"
games = ["gta1"]
text = "The PS1 version has no trains, so the missions \"Gangsta Bang – Counthash\" and \"Heist Almighty – Itali\" are cut. Only the four male characters are selectable (PC has eight). The Japanese version adds two exclusive characters, **Bison** and **Jack**. [1][7][12][20]"

[[section]]
id = "1.5"
origin = "md:119"
title = "1.5 Grand Theft Auto: Game Boy Color (Tarantula Studios; published by Rockstar Games / Take-Two)"
games = ["gta1"]
text = '''
Dual-mode cartridge: also runs in black and white on the original Game Boy and on Super Game Boy. 4 MiB (32 Mbit) ROM. Gore and swearing removed; trains replaced by teleports; adds an exclusive character, Kelly; new chiptune soundtrack. ESRB T. [1][7][13][29][39]


No GBC revisions, prototypes or Japanese release are documented.'''

