platform_text = "Windows"
region = "worldwide download (mailing-list sign-up)"
date_text = "Available by **7 Mar 2003** (Rockstar e-mail reported on AnandTech forums) and \"recently\" freeware by 5 May 2003 (Apolyton). GTA Total: Classics launched in 2003 with GTA only; GTA 2 and Wild Metal followed in late 2004; downloads disabled **May 2013** (\"currently unavailable\"); page redirected to the Rockstar homepage in 2020. Still promoted in Sep 2009 (iGTA). **Uncorroborated dates:** Giant Bomb \"23 Dec 2004\", Internet Archive item \"2002\". Giant Bomb's date is one day after GTA 2 joined Rockstar Classics (22 Dec 2004, AnandTech thread [51]), so it probably mixes up the two games (inference ❓)"
id_text = "Installer `GTAINSTALLER.exe` ≈328.4 MB (archive.org copy); ~336 MB zip (AnandTech). Rockstar gave no version number; OlderGeeks labels it \"1.0\""
notes = "Readme: \"modified from its original version to enable support for modern PC's\" and Windows. Adds high resolutions (1600×1200 reported). London packs not included. CD-audio tracks are ripped to WAV with track8/9/10 mis-ordered"
