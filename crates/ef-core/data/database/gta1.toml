title = "Original design document, \"Race'n'Chase\" (Game Design doc, **Version 1.05**)"
date_text = "dated **22 Mar 1995**; put online by ex-DMA programmer Mike Dailly on **22 Mar 2011** (Flickr set; later hosted at gamedevs.org)"
version = "1.05"
notes = "Pitch for a \"fun, addictive, and fast multiplayer car racing and crashing game\"; present-day setting; three cities with different graphic styles (New York, Venice, Miami); missions incl. a straight race across the city, a free-roaming demolition derby, a bank robbery; pedestrians can be run over; car theft sets off alarms that bring police; police can leave cars and shoot; cars, maybe boats, helicopters, lorries. Planned platforms: MS-DOS, Windows 95, PlayStation, Sega Saturn, Nintendo 64. Toolchain per Wikipedia (from the doc): Visual C++ 2.0, Watcom C/C++ 10, MASM 6.1, DOS4GW 1.97. GTA.wiki shows 12 page images (cover, revision list, ToC, pp. 4–12). \"1.05\" is the document's revision, **not** a game build"
