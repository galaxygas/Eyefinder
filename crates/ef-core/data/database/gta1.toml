[[entry]]
id = "1.1-7"
origin = "md:57"
section = "1.1"
kind = "prototype"
games = ["gta1"]
title = "**\"GTA ProtoType 1\"** (Mike Dailly)"
date = "1994-11-11"
date_text = "build **11 Nov 1994** (\"11/11/94 was the date on the CD\", per Dailly's readme)"
notes = "Released executable (PC, DOS). Side-on / rotating-grid \"cube array\" engine written by Dailly in Pascal + assembler on a 486DX66; controls Z/X rotate, < > tilt, Space removes roofs. Readme: the game was \"going to be GTA (or 'race and chase' as it was then – cops and robbers was the other name considered)\"; dropped because *Syndicate Wars* looked too similar and Keith Hamilton's C rewrite was too slow. Once hosted on mikedailly.com (Wayback 30 May 2008); now on Hidden Palace and BetaArchive. **Note:** this date is earlier than the 22 Mar 1995 design doc and the 4 Apr 1995 development start above"
confidence = "confirmed"
confidence_text = "✅ (HP page + readme, mirrored from Dailly's own site)"
sources = ["1-40"]
sources_text = "[40]"

[[entry]]
