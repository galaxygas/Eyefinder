origin = "md:58"
section = "1.1"
kind = "prototype"
games = ["gta1"]
title = "**\"GTA ProtoType 2\"** (Mike Dailly), exe `DINO.EXE`"
date = "1995-02-02"
date_text = "build **2 Feb 1995** (readme \"(2/2/95)\")"
notes = "Released executable (PC, DOS); DINO.EXE contains debug symbols. Top-down proof of concept with zoom, pan, FOV and building-height controls. Readme: named DINO because the code came from an earlier dinosaur prototype, *ATTACK!*, and \"DINO.BAT was even shipped\" in `\\gta\\gtados`. After seeing it, Keith, \"OZ (David Ozbourn)\" and Dave Jones (readme spelling) decided to restart \"Race and Chase\" on this engine. The readme also says the 24-bit mode (via SciTech UniVBE) \"added almost a year to the project\", and that the 3Dfx renderer started as a one-week demo for a 3Dfx visit and was then kept for the final release"
confidence = "confirmed"
confidence_text = "✅ (HP page + readme)"
