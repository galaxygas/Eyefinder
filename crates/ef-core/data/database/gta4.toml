id = "7.5"
origin = "md:1520"
title = "7.5 PC patch history — Grand Theft Auto IV (GFWL era, 2008–2016)"
games = ["gta4"]
text = "Rockstar shipped region-specific numbering: EFIGS (English/French/Italian/German/Spanish), Russian and Japanese builds carried different version numbers for the same \"Patch N\" Patch 5 (1.0.5.0) merged the region SKUs into a single all-language executable, yet Rockstar continued to publish separate Russian and Japanese version numbers through Patch 8. The Rockstar Support page dates shown today (e.g. 2024/2026) are page-update dates, not release dates."

