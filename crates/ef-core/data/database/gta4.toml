[[entry]]
id = "7.2-1"
origin = "md:1480"
section = "7.2"
kind = "prototype"
games = ["gta4"]
title = "**\"2007 beta\" / Nov 2007 prototype** (Xbox 360 XDK)"
platforms = ["x360"]
platform_text = "Xbox 360 development kit (labelled Rockstar North hardware)"
region = "UK (found in Scotland)"
date_text = "Build dated **2007-11-23**; find publicised on GTAForums by user *janmatant*; press coverage from **2026-03-29**"
id_text = "No version string published in press coverage"
notes = "Kit bought for £5 at a car-boot sale in Scotland. Build ~95% complete; reported as 127 GB (GTA BOOM) vs. \"118 GB\" (Notebookcheck headline) — figures conflict. Missing parts of movie data, common data files and `xbox360.rpf`, so it freezes/is unplayable as found (modders later reportedly got it running on X360 and the Xenia emulator ⚠️). Contents: early/beta character models, placeholder weapon models, early Niko aim-walk animation, different radio content, unused logos, early phone designs, ferry model from Trailer 1, references to a cut zombie mode/minigame **\"Z: Resurrection\"** Hidden Palace page \"Grand Theft Auto IV (Nov 23, 2007 prototype)\": origin Xbox 360 **Test Kit**; build date Nov 23, 2007; **build name 78** (retail EU version = 118, per Hidden Palace); files released **2026-03-28**; ~95% intact; `movies` folder contents and `xbox360.rpf`/script missing so it freezes; xex fragmented and dongle-protected (Hidden Palace hosts a defragmented xex, a dongle-removed \"GTA4Final_xenon_patched.xex\", repaired `nj_03.img` and `componentpeds.img`); status \"redump needed\". HP lists the final build date as Mar 31, 2008 (US)"
confidence = "confirmed"
confidence_text = "✅ (multiple outlets, all relaying the same GTAForums report; Hidden Palace hosts the files)"
sources = ["7-2", "7-3", "7-4", "7-5", "7-83"]
sources_text = "2, 3, 4, 5, 83"

