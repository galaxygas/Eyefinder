notes = "Files from a build with very early assets, some matching the first public screenshots. TCRF calls the 2025 LCS leaks the first full prototype of any 3D-era GTA game to surface. Hidden Palace: dumped and released by **IAmNotToniCipriani**, leaked on GTAForums, original filename `lcs may.rar`; only the `USRDIR` folder was released (no `SYSDIR`), the `EBOOT.BIN` is an SDK sample, so it is unplayable and no patch exists; contains some files dated 2017–2018. HP download named \"(May 28, 2005 prototype) incomplete\". The UMD label date (22 May) differs from the build date (29 May). Hashes not shown on HP."
