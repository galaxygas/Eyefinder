origin = "md:1152"
title = "6.2 Grand Theft Auto: Liberty City Stories (PSP 2005 · PS2 2006 · PS3 PSN 2013 · iOS 2015 · Android/Fire OS 2016)"
games = ["lcs"]
text = "Developed by **Rockstar Leeds** with **Rockstar North**. Published by Rockstar Games, and by **Capcom** in Japan. It was the first game on Rockstar's new in-house engine, replacing RenderWare (IGN preview of 2005-09-09, cited by Wikipedia) [13][14][15]."

