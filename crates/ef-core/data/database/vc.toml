[[section]]
id = "4.6"
origin = "md:762"
title = "4.6 Mobile — 10th Anniversary Edition (War Drum Studios port)"
games = ["vc"]
text = "Announced 26 Oct 2012, detailed 21 Nov 2012 (GTA Wiki); launch price US$4.99 (UK £2.99 App Store / £3.29 Google Play) [13]. Features: native hi-res graphics, updated character models & lighting, customisable controls [13]. Songs removed vs PS2/PC (licensing): \"Billie Jean\", \"Wanna Be Startin' Somethin'\" (Michael Jackson), \"Rockit\" (Herbie Hancock), \"Looking For The Perfect Beat\" (Afrika Bambaataa), \"The Smurf\" (Tyrone Brunson), \"Bark at the Moon\" (Ozzy Osbourne), \"Añunga Ñunga\" (Irakere), \"Wow\" (Kate Bush); \"Self-Control\" (Laura Branigan) replaces the first-vehicle song [11]. Japanese-version censorship not present on smartphone version (ja.wikipedia) [19]."

