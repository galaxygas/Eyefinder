notes = "Dumped by \"johndoe2\", released on GTAForums by IAmNotToniCipriani, amplified by Vadim M. (@NationalPepper). Despite calling itself v1.50 it predates the final US v1.40. Contains debug view (L1+R1+L3+R3), early vehicle/character models (e.g. SWAT), different wheels, alternative theme mix, different intro/cutscene cameras & animations, thicker black HUD text outlines. Speculated (not proven) to be a press/preview build for outlets like GameSpot. Context: Redump has a **retail** EU disc that is also v1.50 (SLES-51061, EXE date 2002-10-06, edition \"Original\"; see 4.2). So \"v1.50\" was the version number of the first EU retail pressing, and the prototype carries the same number five days before that retail EXE date."
