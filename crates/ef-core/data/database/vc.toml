[[section]]
id = "4"
origin = "md:656"
title = "4. Grand Theft Auto: Vice City (2002)"
games = ["vc"]
text = "Developer: Rockstar North (PS2/PC); Rockstar Vienna (Xbox port, per TCRF); War Drum Studios (2012 mobile port, per TCRF). Publisher: Rockstar Games (Capcom in Japan). Announced at E3, 22 May 2002 [1]. Scope note: the 2021 Definitive Edition and Vice City Stories (2006) are covered in other sections."

[[section]]
id = "4.1"
origin = "md:660"
title = "4.1 Development timeline and pre-release"
games = ["vc"]
text = '''
Notes:
- No other Vice City prototype (pre-release disc, demo disc or PC beta) is listed on Hidden Palace as of research date; Hidden Palace lists only the Oct 1, 2002 PS2 build plus an EPK, a Take-Two 2003 catalogue and a Double Pack Xbox video (non-prototype material) [3].
- No playable PC/Xbox demo of Vice City was found documented — "not documented".
- TCRF's main Vice City page lists a "Development Info" subpage but no "Proto:" prototype page; Hidden Palace says TCRF has a research article on the Oct 2002 build. The Development Info subpage could not be fetched (site error) — content not verified here.
- The 2025 press coverage disagrees on purpose of the build: Rockstar Intel/GTABoom/Time Extension relay forum speculation that it was a GameSpot/press preview build; jasondeegan.com suggests a developer beta. Treat as unresolved ❓.'''

[[section]]
id = "4.2"
origin = "md:678"
title = "4.2 PlayStation 2 — retail releases and disc revisions"
games = ["vc"]

[[section]]
id = "4.2.ps2-internal-version-revisions-per-tcrf"
origin = "md:696"
title = "PS2 internal version revisions (per TCRF)"
games = ["vc"]
text = "Haitian controversy timeline (context for v3.00): Nov 2003 protests by Haitian Centers Council and Haitian Americans for Human Rights in NYC; Mayor Bloomberg threatened legal action; Take-Two apologised and agreed to remove the statements from future copies (GameDeveloper/Gamasutra report dated 10 Dec 2003) [1][20][21]."

[[section]]
id = "4.3"
origin = "md:709"
title = "4.3 Windows PC — retail, patch, digital"
games = ["vc"]
text = "Gaps: exact byte sizes / timestamps of the v1.0, v1.1, Steam, Japanese and RGL executables (normally on gtamods.com) could not be retrieved. gtamods.com returned server errors in the first pass and a maintenance page in the second. Patch 1.1 date: 19 May 2003 from a single source group (⚠️)."

[[section]]
id = "4.3a"
origin = "md:731"
title = "4.3a PC executable builds recognised by modding tools"
games = ["vc"]
text = "Community modding toolkits must tell PC executables apart, so their detection code is evidence of which distinct `.exe` builds exist. Plugin-SDK (the main C++ modding SDK for the 3D-era games) recognises exactly three Vice City executables, identified by the address of a known function prologue (`55 89 E5 53`, read as 0x53E58955). This confirms at least these three distinct builds (v1.0, v1.1, Steam); other executables (e.g. Japanese, Rockstar Games Launcher, Mac) exist but are not handled by Plugin-SDK. It gives no file sizes or dates; the gtamods.com exe table (sizes/timestamps) was offline during research."

