; GTA III Music Ripper settings. Keep this file next to gta3_music_ripper.asi.
[Ripper]
; 1 = run on game start, 0 = do nothing
Enabled=1
; Extraction runs once. It is skipped while "<OutputFolder>\_extraction_complete.txt" exists.
; Set Force=1 (or delete that file) to extract again on the next start.
Force=0
; Folder created inside the game folder
OutputFolder=Extracted Audio
; MP3 / MP2 sources are decoded to 32-bit float WAV (full decoder precision) when 1,
; or to 16-bit PCM WAV when 0. ADPCM sources always decode to 16-bit PCM (their exact output),
; PCM sources are always copied bit-exact.
MpegFloat32=1
; Mission dialogue streams (lib_a1.wav etc.)
ExtractMissionAudio=1
; Audio tracks of movies\*.mpg (intro / title movies)
ExtractMovieAudio=1
; Also save the untouched MPEG audio bitstream demuxed from each movie (.original.mp2)
KeepMovieAudioBitstream=1
; Every sample of AUDIO\SFX.RAW (3032 files on the PC version)
ExtractSfxBank=1
; Any other .wav / .mp3 in the AUDIO folder that is not in the game's stream table
ExtractOtherAudioFiles=1
